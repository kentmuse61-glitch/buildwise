<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#10231f">
  <meta name="description" content="Early-stage Ghana construction concept planning, cost estimation and project scheduling workspace.">
  <title>Buildwise GH — Construction AI</title>
  <link rel="stylesheet" href="/styles.css?v=1.3.0">
  <script type="module" src="/vendor/model-viewer.min.js?v=1.3.0"></script>
  <script src="/viewer3d.js?v=1.3.0" defer></script>
  <script src="/app.js?v=1.3.0" defer></script>
</head>
<body>
  <div id="workspace" class="workspace">
    <aside id="sidebar" class="sidebar">
      <a class="brand sidebar-brand" href="#overview" aria-label="Buildwise GH home">
        <span class="brand-mark" aria-hidden="true"><span></span><span></span><span></span></span>
        <span class="brand-name">Buildwise <b>GH</b><small>CONSTRUCTION AI</small></span>
      </a>
      <div class="sidebar-label">WORKSPACE</div>
      <nav class="side-nav" aria-label="Main navigation">
        <button class="nav-item active" type="button" data-view="overview"><span class="nav-glyph">⌂</span><span>Overview</span></button>
        <button class="nav-item" type="button" data-view="create"><span class="nav-glyph nav-plus">＋</span><span>New concept</span></button>
        <button class="nav-item" type="button" data-view="projects"><span class="nav-glyph">▤</span><span>Session concepts</span><span id="nav-project-count" class="nav-count">0</span></button>
        <button class="nav-item" type="button" data-view="contractors"><span class="nav-glyph">⌕</span><span>Contractor directory</span></button>
      </nav>
      <div class="sidebar-bottom">
        <div class="sidebar-note"><span class="note-icon">✦</span><div><strong>Concept-stage tools</strong><p>Review every output with qualified local professionals.</p></div></div>
        <div class="profile-row">
          <div id="user-avatar" class="avatar">G</div>
          <div class="profile-copy"><strong id="user-label">Guest concept mode</strong><span>Temporary browser session</span></div>
        </div>
      </div>
    </aside>

    <main class="main-area">
      <header class="topbar">
        <button id="mobile-menu-toggle" class="mobile-menu icon-button" type="button" aria-label="Open navigation">☰</button>
        <div class="topbar-title"><span id="page-eyebrow" class="eyebrow">YOUR WORKSPACE</span><h1 id="page-title">Overview</h1></div>
        <div class="topbar-actions">
          <span class="topbar-location"><span class="location-dot"></span> Ghana</span>
          <button class="button button-primary topbar-new" type="button" data-view="create"><span>＋</span> New concept</button>
        </div>
      </header>
      <div id="view-content" class="view-content"></div>
      <footer class="app-footer"><span>Buildwise GH <span class="footer-dot">·</span> Construction AI MVP</span><span>Concept tools only — verify with local professionals.</span></footer>
    </main>
  </div>

  <div id="toast-container" class="toast-container" aria-live="polite" aria-atomic="true"></div>
</body>
</html>
